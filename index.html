<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E-Azubi Trainer</title>
<meta name="description" content="Lern-App für Auszubildende im Elektrohandwerk: Berufsschulstoff nach Lernfeldern und Lehrjahren, Lernpfad mit Schaltplänen, Verteiler, Zählerschrank, Messsystemen, Erdung, E-Mobilität und Photovoltaik.">
<meta name="theme-color" content="#1c2528">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="E-Azubi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<a class="skip" href="#view">Zum Inhalt springen</a>

<header class="topbar" id="topbar">
  <a class="brand" href="#/pfad" aria-label="E-Azubi Trainer, zum Lernpfad">
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2 4.5 13.6h6.3L9.8 22l9.7-12.3h-6.4z" fill="currentColor"/></svg>
    <span>E-Azubi</span>
  </a>
  <div class="top-stats">
    <span class="streak" title="Tagesserie in Tagen">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2 4.5 13.6h6.3L9.8 22l9.7-12.3h-6.4z"/></svg>
      <b id="top-streak">0</b><span class="sr-only"> Tage Serie</span>
    </span>
    <span class="xp" id="top-xp">0 XP</span>
    <span class="goal-ring" id="top-goal" role="img" aria-label="Tagesziel"><span>0</span></span>
  </div>
</header>

<nav class="nav" aria-label="Hauptnavigation">
  <a href="#/pfad" data-route="pfad">
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 20c0-4 5-4 6-8s6-4 6-8"/><circle cx="6" cy="20" r="1.6"/><circle cx="18" cy="4" r="1.6"/></svg>
    <span>Lernpfad</span>
  </a>
  <a href="#/schule" data-route="schule">
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9.5 12 4.5l10 5-10 5z"/><path d="M6 11.5V16c2.5 2.2 9.5 2.2 12 0v-4.5M22 9.5v5.5"/></svg>
    <span>Schule</span>
  </a>
  <a href="#/werkstatt" data-route="werkstatt">
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6.5l3-3 3 3-3 3M14.5 6.5L5 16l3 3 9.5-9.5"/></svg>
    <span>Werkstatt</span>
  </a>
  <a href="#/fortschritt" data-route="fortschritt">
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M10 20V6M15 20v-9M20 20V9"/></svg>
    <span>Fortschritt</span>
  </a>
  <a href="#/profil" data-route="profil">
    <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20c1.2-4 4-5.5 7.5-5.5s6.3 1.5 7.5 5.5"/></svg>
    <span>Profil</span>
  </a>
</nav>

<main id="view" tabindex="-1"></main>

<div class="update" id="update" role="status" hidden>
  <span>Eine neue Version ist da.</span>
  <button class="btn small primary" type="button">Jetzt laden</button>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<dialog id="karte" aria-labelledby="karte-t">
  <div class="dlg">
    <h2 id="karte-t">Lernkarte</h2>
    <ul></ul>
    <button class="btn primary" type="button" data-close>Schließen</button>
  </div>
</dialog>

<p id="status" class="sr-only" aria-live="polite"></p>
<p class="foot-ver">E-Azubi Trainer · Version <span id="app-version"></span></p>
<noscript><p class="noscript">Der E-Azubi Trainer braucht JavaScript. Bitte im Browser aktivieren.</p></noscript>
</body>
</html>
